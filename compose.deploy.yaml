# Standalone production compose: do NOT combine with the development compose.yaml.
# External volumes must be created explicitly by scripts/deploy/init.py.
name: hwp-assistant-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17.11-alpine@sha256:1bcc18d81671b02906296aad470ec9778a6b71016ce953092024b680bad007b0
    restart: unless-stopped
    environment:
      POSTGRES_DB: hwp_assistant
      POSTGRES_USER: hwp_assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/deploy/init.py first}
    volumes:
      - metadata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *logging

  api:
    image: ${HWP_IMAGE_PREFIX:-ghcr.io/m4r4m01m/hwp-assistant}-api:${HWP_IMAGE_TAG:?Set an immutable source commit SHA}
    platform: linux/amd64
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        HWP_REVISION: ${HWP_IMAGE_TAG}
    command: ["python", "-m", "app.production"]
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=128m
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASE_URL: postgresql+psycopg://hwp_assistant:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/hwp_assistant
      STORAGE_DIR: /data/files
      HWP_AUTH_TOKENS: ${HWP_AUTH_TOKENS:?Set individual user tokens}
      HWP_LEGACY_OWNER: ${HWP_LEGACY_OWNER:-}
      HWP_ALLOWED_HOSTS: ${HWP_ALLOWED_HOSTS:-pseudowasabi-svr.taile7b6c4.ts.net,localhost,127.0.0.1,[::1]}
      HWP_AUTH_SESSION_TTL_SECONDS: ${HWP_AUTH_SESSION_TTL_SECONDS:-28800}
      HWP_AUTH_SESSION_IDLE_SECONDS: ${HWP_AUTH_SESSION_IDLE_SECONDS:-1800}
      HWP_AUTH_SESSION_MAX_PER_USER: ${HWP_AUTH_SESSION_MAX_PER_USER:-20}
      HWP_AI_REQUESTS_PER_MINUTE: ${HWP_AI_REQUESTS_PER_MINUTE:-20}
      HWP_LLM_ALLOWED_USERS: ${HWP_LLM_ALLOWED_USERS:-}
      # Explicit owner mapping; signup never grants the personal Codex account.
      HWP_REWRITE_PROVIDER: ${HWP_REWRITE_PROVIDER:-codex}
      HWP_DOCUMENT_ASSISTANT_PROVIDER: ${HWP_DOCUMENT_ASSISTANT_PROVIDER:-codex}
      HWP_CHAT_PROVIDER: ${HWP_CHAT_PROVIDER:-llm}
      HWP_REVIEW_PROVIDER: ${HWP_REVIEW_PROVIDER:-llm}
      HWP_CODEX_USER: ${HWP_CODEX_USER:-local}
      HWP_CODEX_ALLOWED_USERS: ${HWP_CODEX_ALLOWED_USERS:-}
      HWP_CODEX_MODEL: ${HWP_CODEX_MODEL:-}
      HWP_CODEX_API_URL: http://127.0.0.1:8000
      HWP_CODEX_CHECK_AUTH: "1"
      HWP_CODEX_DAILY_REQUEST_LIMIT: ${HWP_CODEX_DAILY_REQUEST_LIMIT:-60}
      CODEX_HOME: /home/app/.codex
      HWP_ACCOUNTS_ENABLED: ${HWP_ACCOUNTS_ENABLED:-0}
      HWP_REGISTRATION_ENABLED: ${HWP_REGISTRATION_ENABLED:-0}
      HWP_REGISTRATION_MAX_USERS: ${HWP_REGISTRATION_MAX_USERS:-100}
      HWP_SAMPLE_ACCOUNTS: ${HWP_SAMPLE_ACCOUNTS:-[]}
      HWP_GUEST_PASSWORD: ${HWP_GUEST_PASSWORD:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      HWP_REWRITE_MAX_ACTIVE: ${HWP_REWRITE_MAX_ACTIVE:-1}
      SESSION_TTL_SECONDS: "120"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - documents:/data/files
      - codex-state:/home/app/.codex
    networks: [app, data]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.production", "--check"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *logging

  web:
    image: ${HWP_IMAGE_PREFIX:-ghcr.io/m4r4m01m/hwp-assistant}-web:${HWP_IMAGE_TAG:?Set an immutable source commit SHA}
    platform: linux/amd64
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        HWP_REVISION: ${HWP_IMAGE_TAG}
        HWP_PUBLIC_BASE_PATH: /hwp-assistant/
        HWP_NGINX_CONF: deploy/nginx.hwp-assistant.conf
    restart: unless-stopped
    ports:
      - "127.0.0.1:23000:80"
    networks: [app]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *logging

networks:
  app: {}
  data:
    internal: true

# A routine `down -v` cannot remove external volumes. Do not delete them manually.
volumes:
  metadata:
    external: true
    name: hwp-assistant-prod-metadata
  documents:
    external: true
    name: hwp-assistant-prod-documents
  # Credentials are private runtime state, never part of the web image/artifacts.
  codex-state:
    external: true
    name: hwp-assistant-prod-codex-state
