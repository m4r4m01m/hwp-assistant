# CI ONLY. Overlay on compose.deploy.yaml on an isolated GitHub-hosted runner.
services:
  gateway:
    image: nginx:1.30.6-alpine@sha256:c59d1f8b1e0e42da75be973424cd72e23f7f8adfb54e982f4d1cd0216a5a5576
    ports: ["127.0.0.1:24443:443"]
    volumes:
      - ./deploy/ci-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ${HWP_CI_CERT_DIR:?CI certificate directory required}:/certs:ro
    networks: [app]
    depends_on:
      web:
        condition: service_healthy
