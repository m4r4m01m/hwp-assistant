# Only successful content-addressed assets are immutable. Entry points and
# versionless fonts must revalidate; errors must never receive a one-year cache.
map "$status:$uri" $hwp_cache_control {
  default "no-cache";
  ~^[0-9]+:/api/ "no-store";
  "~^(200|206|304):/(assets|rhwp/assets)/[^/]+-[A-Za-z0-9_-]{8,}\.(js|css|wasm|woff2?|png|svg|webp|jpg|jpeg|gif)$" "public, max-age=31536000, immutable";
}
# Host Nginx has already removed /hwp-assistant/. Files remain at / internally.
# This file replaces frontend/nginx.conf only for the deployment image.
map $http_x_forwarded_proto $hwp_forwarded_proto {
  default $scheme;
  https https;
  http http;
}
server {
  listen 80;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  server_tokens off;
  gzip off;
  gzip_static on;
  gzip_vary on;
  gzip_proxied any;
  add_header Cache-Control $hwp_cache_control always;
  client_max_body_size 50m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

  location = /healthz { access_log off; return 200 "ok\n"; }
  location /api/ {
    gzip_static off;
    proxy_hide_header Cache-Control;
    # Re-resolve after an API container is replaced; no stale container IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $hwp_api http://api:8000;
    proxy_pass $hwp_api;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $hwp_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cookie_path /api /hwp-assistant/api;
    proxy_read_timeout 240s;
    proxy_buffering off;
  }
  location /rhwp/ { try_files $uri $uri/ =404; }
  location /assets/ { try_files $uri =404; }
  location = /comparison-core.js { try_files $uri =404; }
  location = /comparison-engine.json { try_files $uri =404; }
  location = /compare-renderer.html { try_files $uri =404; }
  location = /index.html { }
  location / { try_files $uri $uri/ /index.html; }
}
