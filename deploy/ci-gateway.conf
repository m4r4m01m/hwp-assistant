# Test-only stand-in for Funnel + the prefix-stripping host Nginx.
upstream hwp_ci_web {
  zone hwp_ci_web 64k;
  # App restarts can change the web container IP while this gateway stays up.
  resolver 127.0.0.11 valid=5s ipv6=off;
  server web:80 resolve;
}

server {
  listen 443 ssl;
  server_name localhost;
  ssl_certificate /certs/cert.pem;
  ssl_certificate_key /certs/key.pem;
  absolute_redirect off;
  location / { return 404; }
  location /hwp-assistant/ {
    proxy_pass http://hwp_ci_web/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 50m;
    proxy_read_timeout 240s;
  }
}
