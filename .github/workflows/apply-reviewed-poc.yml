name: Apply reviewed PoC source (temporary)
on:
  push:
    branches: [feat/codex-accounts-prewarm-2026-10-25]
    paths: [.github/workflows/apply-reviewed-poc.yml, '.poc-edits-*.json']
permissions:
  contents: write
jobs:
  apply-reviewed-source:
    if: github.repository == 'm4r4m01m/hwp-assistant' && github.ref == 'refs/heads/feat/codex-accounts-prewarm-2026-10-25'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify every input and output hash before writing the reviewed branch
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          digest=lambda value:hashlib.sha256(value).hexdigest()
          outputs={}
          for number in (1,2,3):
              value=json.loads(Path(f'.poc-edits-{number}.json').read_text())
              assert value['base']=='fc0afef31ff33d3a3817b8576f981ee144f80f52'
              for name,expected in value.get('new_files',{}).items():
                  assert digest(Path(name).read_bytes())==expected, f'new file differs: {name}'
              for row in value['files']:
                  name=row['path']; path=Path(name)
                  assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
                  assert not name.startswith('.github/') and name not in outputs
                  raw=path.read_bytes()
                  assert digest(raw)==row['before'], f'base differs: {name}'
                  lines=raw.decode('utf-8').splitlines(keepends=True)
                  for offset,count,replacement in reversed(row['edits']):
                      assert 0<=offset<=len(lines) and 0<=count<=len(lines)-offset
                      lines[offset:offset+count]=[replacement]
                  result=''.join(lines).encode('utf-8')
                  assert digest(result)==row['after'], f'reviewed output differs: {name}'
                  outputs[name]=result
          assert len(outputs)==27
          for name,result in outputs.items():
              Path(name).write_bytes(result)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*outputs],check=True)
          print('Verified 18 new files and 27 exact reviewed file updates; no production access.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: integrate password accounts, Codex runtime and login resource prewarm'
          git push origin HEAD:refs/heads/feat/codex-accounts-prewarm-2026-10-25
